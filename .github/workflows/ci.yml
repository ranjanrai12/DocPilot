name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version` here on purpose — action-setup reads it from the
      # "packageManager" field in package.json (pnpm@11.5.0). Specifying both
      # errors with ERR_PNPM_BAD_PM_VERSION.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api db:generate

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm --filter api test

# Note: integration tests (apps/api `pnpm test:integration`) need a real Postgres
# with the RLS migration + pgvector + least-privilege role, so they run locally /
# in a dedicated job with a provisioned DB — not in this lightweight CI lane.
