packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true

# Allow these dependencies to run their install/build scripts.
# esbuild (Vite + tsup) and Prisma need this to install their binaries/engines.
onlyBuiltDependencies:
  - esbuild
  - prisma
  - '@prisma/client'
  - '@prisma/engines'
