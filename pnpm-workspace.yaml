packages:
  - 'apps/*'
  - 'packages/*'

# Dedupe ioredis to a single version so the instance we create (lib/redis) is
# type-compatible with the copy BullMQ expects for its `connection` option.
overrides:
  ioredis: 5.11.1

# pnpm v10+ blocks dependency install/build scripts unless approved. Approve
# every dependency that ships a build script, or `pnpm install` fails CI with
# ERR_PNPM_IGNORED_BUILDS. Both keys are populated so whichever this pnpm build
# honors, all are covered: esbuild (Vite + tsup binaries), Prisma (engines),
# and msgpackr-extract (optional native accelerator).
onlyBuiltDependencies:
  - esbuild
  - msgpackr-extract
  - prisma
  - '@prisma/client'
  - '@prisma/engines'

allowBuilds:
  esbuild: true
  msgpackr-extract: true
  prisma: true
  '@prisma/client': true
  '@prisma/engines': true
