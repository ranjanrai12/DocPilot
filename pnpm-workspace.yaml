packages:
  - 'apps/*'
  - 'packages/*'

# Dedupe ioredis to a single version so the instance we create (lib/redis) is
# type-compatible with the copy BullMQ expects for its `connection` option.
overrides:
  ioredis: 5.11.1

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  msgpackr-extract: set this to true or false
  prisma: true

# Allow these dependencies to run their install/build scripts.
# esbuild (Vite + tsup) and Prisma need this to install their binaries/engines.
onlyBuiltDependencies:
  - esbuild
  - prisma
  - '@prisma/client'
  - '@prisma/engines'
